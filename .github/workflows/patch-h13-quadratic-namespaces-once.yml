name: One-shot H13 quadratic namespace patch

on:
  push:
    branches:
      - agent/hessian-spinc-maximal-domain
    paths:
      - ".github/workflows/patch-h13-quadratic-namespaces-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hessian-spinc-maximal-domain
          fetch-depth: 0

      - name: Add the missing H13 namespaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPGlobalCandidateAMatterLLQuadraticChartBridge4D.lean")
          text = path.read_text(encoding="utf-8")
          additions = [
              ("open P0EFTJanusProgramPGlobalCovariantAction4D\n",
               "open P0EFTJanusProgramPGlobalEulerLagrange4D\n"),
              ("open P0EFTJanusProgramPGlobalCandidateADiagonalExtendedBulkGraphC2Chart4D\n",
               "open P0EFTJanusProgramPGlobalCandidateADiagonalCovariantHessianResidualBridge4D\n"),
          ]
          for anchor, line in additions:
              if line not in text:
                  if anchor not in text:
                      raise SystemExit(f"expected namespace anchor not found: {anchor.strip()}")
                  text = text.replace(anchor, anchor + line, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit the focused source correction
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPGlobalCandidateAMatterLLQuadraticChartBridge4D.lean
          git commit -m "Fix H13 quadratic bridge namespace resolution"
          git push origin HEAD:agent/hessian-spinc-maximal-domain
