name: Program P projection-resolution action-symmetry Hessian

on:
  push:
    branches:
      - dev-branch
      - agent/hessian-spinc-maximal-domain
    paths:
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPFiniteProjectionNormResolution4D.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPCandidateAFiveSectorPrincipalProjectionResolution4D.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPCandidateAFiveSectorProjection*.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPProjectionFiniteMarginActualKernelGap4D.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPGlobalCandidateAProjectionFiniteMargin*.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPGlobalHessianProjectionResolutionActionSymmetryClosure4D.lean"
      - "scripts/audit_hessian_projection_resolution_action_symmetry.py"
      - "docs/hessian_global_01_projection_resolution_action_symmetry.md"
      - ".github/workflows/program-p-hessian-projection-resolution-action-symmetry.yml"
      - "lean-toolchain"
      - "lakefile.lean"
      - "lake-manifest.json"
  pull_request:
    paths:
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPFiniteProjectionNormResolution4D.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPCandidateAFiveSectorPrincipalProjectionResolution4D.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPCandidateAFiveSectorProjection*.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPProjectionFiniteMarginActualKernelGap4D.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPGlobalCandidateAProjectionFiniteMargin*.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPGlobalHessianProjectionResolutionActionSymmetryClosure4D.lean"
      - "scripts/audit_hessian_projection_resolution_action_symmetry.py"
      - "docs/hessian_global_01_projection_resolution_action_symmetry.md"
      - ".github/workflows/program-p-hessian-projection-resolution-action-symmetry.yml"
      - "lean-toolchain"
      - "lakefile.lean"
      - "lake-manifest.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: program-p-hessian-projection-resolution-action-symmetry-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit — positive projection resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run structural audit
        run: python scripts/audit_hessian_projection_resolution_action_symmetry.py

  lean:
    name: Lean — positive projection action-symmetry closure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - uses: actions/cache/restore@v4
        with:
          path: .b
          key: hessian-projection-resolution-action-symmetry-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/**/*.lean') }}
          restore-keys: |
            program-p-build-${{ runner.os }}-
            hessian-projected-principal-action-symmetry-${{ runner.os }}-
      - name: Build positive projection and principal margin layers
        run: >-
          lake build
          JanusFormal.Branches.FundamentalGeometryPVariationalPrinciple.Gates.P0EFTJanusProgramPFiniteProjectionNormResolution4D
          JanusFormal.Branches.FundamentalGeometryPVariationalPrinciple.Gates.P0EFTJanusProgramPCandidateAFiveSectorPrincipalProjectionResolution4D
          JanusFormal.Branches.FundamentalGeometryPVariationalPrinciple.Gates.P0EFTJanusProgramPCandidateAFiveSectorProjectionPhysicalSmallness4D
          JanusFormal.Branches.FundamentalGeometryPVariationalPrinciple.Gates.P0EFTJanusProgramPCandidateAFiveSectorProjectionOperatorGarding4D
          JanusFormal.Branches.FundamentalGeometryPVariationalPrinciple.Gates.P0EFTJanusProgramPProjectionFiniteMarginActualKernelGap4D
      - name: Build Candidate-A H12 and terminal facade
        run: >-
          lake build
          JanusFormal.Branches.FundamentalGeometryPVariationalPrinciple.Gates.P0EFTJanusProgramPGlobalCandidateAProjectionFiniteMarginActualKernelGap4D
          JanusFormal.Branches.FundamentalGeometryPVariationalPrinciple.Gates.P0EFTJanusProgramPGlobalCandidateAProjectionFiniteMarginH12Closure4D
          JanusFormal.Branches.FundamentalGeometryPVariationalPrinciple.Gates.P0EFTJanusProgramPGlobalHessianProjectionResolutionActionSymmetryClosure4D
