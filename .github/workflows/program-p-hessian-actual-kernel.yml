name: Program P actual-kernel Hessian frontier

on:
  push:
    branches:
      - dev-branch
      - agent/hessian-spinc-maximal-domain
    paths:
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPSelfAdjointKernelComplement*4D.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPSelfAdjointClosedRangeKernelGap4D.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPGlobalCandidateAAugmentedActualKernel*4D.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPGlobalCandidateAActualKernelGapFromFredholm4D.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPGlobalCandidateASixPhysicalAggregate*4D.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPGlobalHessianActualKernel*4D.lean"
      - "scripts/audit_hessian_actual_kernel.py"
      - ".github/workflows/program-p-hessian-actual-kernel.yml"
      - "lean-toolchain"
      - "lakefile.lean"
      - "lake-manifest.json"
  pull_request:
    paths:
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPSelfAdjointKernelComplement*4D.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPSelfAdjointClosedRangeKernelGap4D.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPGlobalCandidateAAugmentedActualKernel*4D.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPGlobalCandidateAActualKernelGapFromFredholm4D.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPGlobalCandidateASixPhysicalAggregate*4D.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPGlobalHessianActualKernel*4D.lean"
      - "scripts/audit_hessian_actual_kernel.py"
      - ".github/workflows/program-p-hessian-actual-kernel.yml"
      - "lean-toolchain"
      - "lakefile.lean"
      - "lake-manifest.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: program-p-actual-kernel-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit — actual-kernel frontier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Audit actual-kernel architecture
        run: python scripts/audit_hessian_actual_kernel.py

  generic-kernel-complement:
    name: Lean — generic actual-kernel reduction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - uses: actions/cache/restore@v4
        with:
          path: .b
          key: actual-kernel-generic-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/**/*.lean') }}
          restore-keys: |
            program-p-build-${{ runner.os }}-
            reduced-green-generic-${{ runner.os }}-
      - name: Build reduction, closed-range bridge and resolvent
        run: >-
          lake build
          JanusFormal.Branches.FundamentalGeometryPVariationalPrinciple.Gates.P0EFTJanusProgramPSelfAdjointKernelComplementReduction4D
          JanusFormal.Branches.FundamentalGeometryPVariationalPrinciple.Gates.P0EFTJanusProgramPSelfAdjointClosedRangeKernelGap4D
          JanusFormal.Branches.FundamentalGeometryPVariationalPrinciple.Gates.P0EFTJanusProgramPSelfAdjointKernelComplementResolvent4D

  six-block-bound:
    name: Lean — one H11 six-block bound
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - uses: actions/cache/restore@v4
        with:
          path: .b
          key: actual-kernel-h11-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/**/*.lean') }}
          restore-keys: |
            program-p-build-${{ runner.os }}-
            concrete-hessian-${{ runner.os }}-
      - name: Build aggregate extension and canonical core bound
        run: >-
          lake build
          JanusFormal.Branches.FundamentalGeometryPVariationalPrinciple.Gates.P0EFTJanusProgramPGlobalCandidateASixPhysicalAggregateExtension4D
          JanusFormal.Branches.FundamentalGeometryPVariationalPrinciple.Gates.P0EFTJanusProgramPGlobalCandidateASixPhysicalAggregateBound4D

  candidate-actual-kernel:
    name: Lean — Candidate-A actual-kernel Green and resolvent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - uses: actions/cache/restore@v4
        with:
          path: .b
          key: actual-kernel-candidate-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/**/*.lean') }}
          restore-keys: |
            program-p-build-${{ runner.os }}-
            reduced-green-candidate-${{ runner.os }}-
      - name: Build Candidate-A specialization and compatibility adapter
        run: >-
          lake build
          JanusFormal.Branches.FundamentalGeometryPVariationalPrinciple.Gates.P0EFTJanusProgramPGlobalCandidateAAugmentedActualKernelComplement4D
          JanusFormal.Branches.FundamentalGeometryPVariationalPrinciple.Gates.P0EFTJanusProgramPGlobalCandidateAAugmentedActualKernelResolvent4D
          JanusFormal.Branches.FundamentalGeometryPVariationalPrinciple.Gates.P0EFTJanusProgramPGlobalCandidateAActualKernelGapFromFredholm4D

  terminal-frontier:
    name: Lean — actual-kernel H10-H14 frontier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - uses: actions/cache/restore@v4
        with:
          path: .b
          key: actual-kernel-terminal-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/**/*.lean') }}
          restore-keys: |
            program-p-build-${{ runner.os }}-
            concrete-hessian-${{ runner.os }}-
      - name: Build aggregate and bounded actual-kernel frontiers
        run: >-
          lake build
          JanusFormal.Branches.FundamentalGeometryPVariationalPrinciple.Gates.P0EFTJanusProgramPGlobalHessianActualKernelFrontier4D
          JanusFormal.Branches.FundamentalGeometryPVariationalPrinciple.Gates.P0EFTJanusProgramPGlobalHessianActualKernelBoundedFrontier4D
