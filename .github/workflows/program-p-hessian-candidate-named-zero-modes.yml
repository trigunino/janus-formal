name: Program P Candidate-A named zero modes

on:
  push:
    branches:
      - dev-branch
      - agent/hessian-spinc-maximal-domain
    paths:
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPFiniteKernelNamedMode*.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPSelfAdjointKernelComplementCoercivity4D.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPGlobalCandidateAActualNamedZeroModeCoercivity4D.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPGlobalHessianNamedZeroModeCoercivityFrontier4D.lean"
      - "scripts/audit_hessian_candidate_named_zero_modes.py"
      - ".github/workflows/program-p-hessian-candidate-named-zero-modes.yml"
      - "lean-toolchain"
      - "lakefile.lean"
      - "lake-manifest.json"
  pull_request:
    paths:
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPFiniteKernelNamedMode*.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPSelfAdjointKernelComplementCoercivity4D.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPGlobalCandidateAActualNamedZeroModeCoercivity4D.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPGlobalHessianNamedZeroModeCoercivityFrontier4D.lean"
      - "scripts/audit_hessian_candidate_named_zero_modes.py"
      - ".github/workflows/program-p-hessian-candidate-named-zero-modes.yml"
      - "lean-toolchain"
      - "lakefile.lean"
      - "lake-manifest.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: program-p-candidate-named-zero-modes-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit — Candidate-A named zero modes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run static audit
        run: python scripts/audit_hessian_candidate_named_zero_modes.py

  lean:
    name: Lean — Candidate-A coercive zero-mode frontier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - uses: actions/cache/restore@v4
        with:
          path: .b
          key: candidate-named-zero-modes-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/**/*.lean') }}
          restore-keys: |
            program-p-build-${{ runner.os }}-
            hessian-actual-kernel-${{ runner.os }}-
      - name: Build named coercivity chain
        run: >-
          lake build
          JanusFormal.Branches.FundamentalGeometryPVariationalPrinciple.Gates.P0EFTJanusProgramPFiniteKernelNamedModes4D
          JanusFormal.Branches.FundamentalGeometryPVariationalPrinciple.Gates.P0EFTJanusProgramPFiniteKernelNamedModeOperators4D
          JanusFormal.Branches.FundamentalGeometryPVariationalPrinciple.Gates.P0EFTJanusProgramPSelfAdjointKernelComplementCoercivity4D
          JanusFormal.Branches.FundamentalGeometryPVariationalPrinciple.Gates.P0EFTJanusProgramPGlobalCandidateAActualNamedZeroModeCoercivity4D
          JanusFormal.Branches.FundamentalGeometryPVariationalPrinciple.Gates.P0EFTJanusProgramPGlobalHessianNamedZeroModeCoercivityFrontier4D
