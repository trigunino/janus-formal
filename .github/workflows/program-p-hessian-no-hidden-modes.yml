name: Program P Hessian no-hidden-mode frontier

on:
  push:
    branches:
      - dev-branch
      - agent/hessian-spinc-maximal-domain
    paths:
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPFiniteKernelNamedModeNoHidden4D.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPFiniteKernelNamedModeDecomposition4D.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPNamedModeGardingPerturbation4D.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPGlobalHessianCanonicalSixNoHiddenFrontier4D.lean"
      - "scripts/audit_hessian_no_hidden_modes.py"
      - "docs/hessian_global_01_no_hidden_modes.md"
      - ".github/workflows/program-p-hessian-no-hidden-modes.yml"
      - "lean-toolchain"
      - "lakefile.lean"
      - "lake-manifest.json"
  pull_request:
    paths:
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPFiniteKernelNamedModeNoHidden4D.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPFiniteKernelNamedModeDecomposition4D.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPNamedModeGardingPerturbation4D.lean"
      - "JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPGlobalHessianCanonicalSixNoHiddenFrontier4D.lean"
      - "scripts/audit_hessian_no_hidden_modes.py"
      - "docs/hessian_global_01_no_hidden_modes.md"
      - ".github/workflows/program-p-hessian-no-hidden-modes.yml"
      - "lean-toolchain"
      - "lakefile.lean"
      - "lake-manifest.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: program-p-hessian-no-hidden-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit — no hidden zero modes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/audit_hessian_no_hidden_modes.py

  generic:
    name: Lean — no-hidden-mode and perturbation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - uses: actions/cache/restore@v4
        with:
          path: .b
          key: hessian-no-hidden-generic-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/**/*.lean') }}
          restore-keys: |
            program-p-build-${{ runner.os }}-
            program-p-reduced-hessian-${{ runner.os }}-
      - run: >-
          lake build
          JanusFormal.Branches.FundamentalGeometryPVariationalPrinciple.Gates.P0EFTJanusProgramPFiniteKernelNamedModeNoHidden4D
          JanusFormal.Branches.FundamentalGeometryPVariationalPrinciple.Gates.P0EFTJanusProgramPFiniteKernelNamedModeDecomposition4D
          JanusFormal.Branches.FundamentalGeometryPVariationalPrinciple.Gates.P0EFTJanusProgramPNamedModeGardingPerturbation4D

  candidate:
    name: Lean — Candidate-A no-hidden-mode terminal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - uses: actions/cache/restore@v4
        with:
          path: .b
          key: hessian-no-hidden-candidate-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/**/*.lean') }}
          restore-keys: |
            program-p-build-${{ runner.os }}-
            hessian-no-hidden-generic-${{ runner.os }}-
      - run: >-
          lake build
          JanusFormal.Branches.FundamentalGeometryPVariationalPrinciple.Gates.P0EFTJanusProgramPGlobalHessianCanonicalSixNoHiddenFrontier4D
