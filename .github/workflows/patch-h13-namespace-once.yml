name: One-shot H13 namespace patch

on:
  push:
    branches:
      - agent/hessian-spinc-maximal-domain
    paths:
      - ".github/workflows/patch-h13-namespace-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hessian-spinc-maximal-domain
          fetch-depth: 0

      - name: Add the missing GlobalEulerLagrange namespace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPGlobalCandidateAMatterLLSameActionClosure4D.lean")
          text = path.read_text(encoding="utf-8")
          line = "open P0EFTJanusProgramPGlobalEulerLagrange4D\n"
          if line not in text:
              anchor = "open P0EFTJanusProgramPGlobalCovariantAction4D\n"
              if anchor not in text:
                  raise SystemExit("expected namespace anchor not found")
              text = text.replace(anchor, anchor + line, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit the focused source correction
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JanusFormal/Branches/FundamentalGeometryPVariationalPrinciple/Gates/P0EFTJanusProgramPGlobalCandidateAMatterLLSameActionClosure4D.lean
          git commit -m "Fix H13 action-block namespace resolution"
          git push origin HEAD:agent/hessian-spinc-maximal-domain
