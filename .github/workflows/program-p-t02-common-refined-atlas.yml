name: Program P T02 physical second-jet core

on:
  push:
    branches:
      - agent/t02-common-refined-atlas
    paths:
      - "JanusFormal/Branches/FundamentalGeometryPEJetUniversality/Gates/P0EFTJanusPhysicalSecondJetSmoothVectorBundleCore.lean"
      - ".github/workflows/program-p-t02-common-refined-atlas.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  PRODUCT_MODULE: JanusFormal.Branches.FundamentalGeometryPEJetUniversality.Gates.P0EFTJanusPhysicalSecondJetProductVectorBundleCore
  PRODUCT_OLEAN: .b/l/JanusFormal/Branches/FundamentalGeometryPEJetUniversality/Gates/P0EFTJanusPhysicalSecondJetProductVectorBundleCore.olean
  SMOOTH_FILE: JanusFormal/Branches/FundamentalGeometryPEJetUniversality/Gates/P0EFTJanusPhysicalSecondJetSmoothVectorBundleCore.lean
  SMOOTH_MODULE: JanusFormal.Branches.FundamentalGeometryPEJetUniversality.Gates.P0EFTJanusPhysicalSecondJetSmoothVectorBundleCore
  SMOOTH_OLEAN: .b/l/JanusFormal/Branches/FundamentalGeometryPEJetUniversality/Gates/P0EFTJanusPhysicalSecondJetSmoothVectorBundleCore.olean

jobs:
  focused-t02-smooth-core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact Lean caches
        id: lean-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .b/l
            .lake/packages/mathlib/.lake/build
          key: t02-smooth-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            t02-smooth-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
            t02-core-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
            t02-atlas-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-

      - name: Set up Lean 4.31 without a project build
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Populate the pinned Mathlib cache when absent
        run: |
          if [[ -n "$(find .lake/packages/mathlib/.lake/build -name Mathlib.olean -print -quit 2>/dev/null)" ]]; then
            echo "Pinned Mathlib cache already present."
          else
            lake exe cache get
          fi

      - name: Ensure the compiled product-core import exists
        run: |
          if [[ ! -f "$PRODUCT_OLEAN" ]]; then
            lake build +"$PRODUCT_MODULE":olean
          fi
          test -f "$PRODUCT_OLEAN"

      - name: Elaborate only the smooth physical core with one Lean worker
        run: lake lean "$SMOOTH_FILE" -- -j 1

      - name: Build only the smooth-core olean artifact
        run: lake build +"$SMOOTH_MODULE":olean

      - name: Verify the exact smooth-core artifact
        run: test -f "$SMOOTH_OLEAN"

      - name: Reject proof placeholders and unfinished markers
        run: |
          for file in \
            JanusFormal/Branches/FundamentalGeometryPEJetUniversality/Gates/P0EFTJanusPhysicalSecondJetCommonRefinedAtlas.lean \
            JanusFormal/Branches/FundamentalGeometryPEJetUniversality/Gates/P0EFTJanusPhysicalSecondJetProductVectorBundleCore.lean \
            "$SMOOTH_FILE"; do
            if grep -nE '\b(sorry|admit|axiom|TODO|FIXME)\b' "$file"; then
              exit 1
            fi
          done

      - name: Run the Program P integrity audit
        run: python scripts/audit_janus_program_p.py

      - name: Check the branch diff
        run: git diff --check origin/dev-branch...HEAD

      - name: Save exact Lean caches
        if: ${{ always() && steps.lean-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .b/l
            .lake/packages/mathlib/.lake/build
          key: t02-smooth-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
