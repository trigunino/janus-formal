name: Program P T02 physical second-jet section

on:
  push:
    branches:
      - agent/t02-common-refined-atlas
    paths:
      - "JanusFormal/Branches/FundamentalGeometryPEJetUniversality/Gates/P0EFTJanusPhysicalSecondJetCommonRefinedAtlas.lean"
      - "JanusFormal/Branches/FundamentalGeometryPEJetUniversality/Gates/P0EFTJanusPhysicalSecondJetProductVectorBundleCore.lean"
      - "JanusFormal/Branches/FundamentalGeometryPEJetUniversality/Gates/P0EFTJanusPhysicalSecondJetSmoothVectorBundleCore.lean"
      - "JanusFormal/Branches/FundamentalGeometryPEJetUniversality/Gates/P0EFTJanusPhysicalSecondJetSmoothSectionAssembly.lean"
      - ".github/workflows/program-p-t02-common-refined-atlas.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  SMOOTH_MODULE: JanusFormal.Branches.FundamentalGeometryPEJetUniversality.Gates.P0EFTJanusPhysicalSecondJetSmoothVectorBundleCore
  SMOOTH_OLEAN: .b/l/JanusFormal/Branches/FundamentalGeometryPEJetUniversality/Gates/P0EFTJanusPhysicalSecondJetSmoothVectorBundleCore.olean
  SECTION_FILE: JanusFormal/Branches/FundamentalGeometryPEJetUniversality/Gates/P0EFTJanusPhysicalSecondJetSmoothSectionAssembly.lean
  SECTION_MODULE: JanusFormal.Branches.FundamentalGeometryPEJetUniversality.Gates.P0EFTJanusPhysicalSecondJetSmoothSectionAssembly
  SECTION_OLEAN: .b/l/JanusFormal/Branches/FundamentalGeometryPEJetUniversality/Gates/P0EFTJanusPhysicalSecondJetSmoothSectionAssembly.olean

jobs:
  focused-t02-section:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cancel the obsolete wrong-base PR workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/33018129473/cancel" || true

      - name: Restore exact project Lean artifacts
        id: lean-cache
        uses: actions/cache/restore@v5
        with:
          path: .b/l
          key: t02-section-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            t02-section-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
            t02-smooth-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
            t02-core-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
            t02-atlas-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-

      - name: Set up Lean 4.31 without a project build
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Fetch the pinned Mathlib package cache
        run: lake exe cache get

      - name: Ensure the compiled smooth-core import exists
        run: |
          if [[ ! -f "$SMOOTH_OLEAN" ]]; then
            lake build +"$SMOOTH_MODULE":olean
          fi
          test -f "$SMOOTH_OLEAN"

      - name: Elaborate only the physical section gate with one Lean worker
        run: lake lean "$SECTION_FILE" -- -j 1

      - name: Build only the physical-section olean artifact
        run: lake build +"$SECTION_MODULE":olean

      - name: Verify the exact physical-section artifact
        run: test -f "$SECTION_OLEAN"

      - name: Reject proof placeholders and unfinished markers
        run: |
          for file in \
            JanusFormal/Branches/FundamentalGeometryPEJetUniversality/Gates/P0EFTJanusPhysicalSecondJetCommonRefinedAtlas.lean \
            JanusFormal/Branches/FundamentalGeometryPEJetUniversality/Gates/P0EFTJanusPhysicalSecondJetProductVectorBundleCore.lean \
            JanusFormal/Branches/FundamentalGeometryPEJetUniversality/Gates/P0EFTJanusPhysicalSecondJetSmoothVectorBundleCore.lean \
            "$SECTION_FILE"; do
            if grep -nE '\b(sorry|admit|axiom|TODO|FIXME)\b' "$file"; then
              exit 1
            fi
          done

      - name: Run the Program P integrity audit
        run: python scripts/audit_janus_program_p.py

      - name: Check the branch diff
        run: git diff --check origin/dev-branch...HEAD

      - name: Save exact project Lean artifacts
        if: ${{ always() && steps.lean-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .b/l
          key: t02-section-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
